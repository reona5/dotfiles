
[env]
TERM = "xterm-256color"

[font]
size = 13.0

[font.bold]
family = "UDEV Gothic NF"
style = "Bold"

[font.italic]
family = "UDEV Gothic NF"
style = "Italic"

[font.normal]
family = "UDEV Gothic NF"
style = "Regular"

# URL クリックを Alacritty 自身に処理させる。
# Shift 押下中はアプリ側のマウスキャプチャ（herdr の mouse_capture）が抑制されるため、
# Mac mini に herdr 越しで繋いでいても手元の MacBook の Chrome で開ける。
[[hints.enabled]]
regex = "https?://[^\\s<>\"'`{}|\\^\\[\\]]+"
command = { program = "open", args = ["-a", "Google Chrome"] }
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Shift" }
binding = { key = "O", mods = "Control|Shift" }

# hints.enabled を書くと Alacritty 既定のヒントを上書きするので、
# http(s) 以外のスキームは既定ハンドラ（open）で拾い直す。
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|news:|file:|git://|ssh:|ftp://)[^\\s<>\"'`{}|\\^\\[\\]]+"
command = "open"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Shift" }
binding = { key = "U", mods = "Control|Shift" }

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\n" },
  { chars = "\u0011", key = "Q", mods = "Control" }
]

[terminal.shell]
args = ["-l", "-c", "herdr"]
program = "/bin/zsh"

[window]
startup_mode = "SimpleFullscreen"

[window.padding]
x = 8
y = 4

[general]
live_config_reload = true
import = ["~/.config/alacritty/catppuccin-mocha.toml"]
