# Switchyard のルーティングプロファイル。`switchyard serve -c` に渡す。
#
# pi 側（.config/pi/models.json）が provider "switchyard" として
# http://127.0.0.1:4100/v1 を叩き、ここの routes のキーをモデル ID として指定する。
# つまり routes のキー名は pi の models.json の id と一対一で対応しているので、
# 片方だけ変えると pi から見えなくなる。
#
# 呼び先は Fireworks の serverless。api_key は ${FIREWORKS_API_KEY} で参照するだけで、
# 実体はこのリポジトリには置かない（1Password から op run で注入する。sy-serve 参照）。
# 未設定のまま起動すると Switchyard が missing environment variable で落ちる。

defaults:
  base_url: https://api.fireworks.ai/inference/v1
  api_key: ${FIREWORKS_API_KEY}

routes:
  # 単一モデルに固定する 3 本。type: model は分岐せず素通しする。
  weak-only:
    type: model
    display_name: DeepSeek V4 Flash
    model: accounts/fireworks/models/deepseek-v4-flash

  strong-only:
    type: model
    display_name: DeepSeek V4 Pro
    model: accounts/fireworks/models/deepseek-v4-pro

  k3-only:
    type: model
    display_name: Kimi K3
    model: accounts/fireworks/models/kimi-k3

  # 既定ルート。stage_router が会話の進行状況を見て weak と strong を振り分ける。
  # classifier は判定に使う小さいモデルで、これも Fireworks に寄せて provider を
  # 1 つに保つ（省略すると LLM による判定をせず signal だけで振る）。
  auto:
    type: stage_router
    display_name: Auto (weak/strong)
    weak:
      id: weak
      model: accounts/fireworks/models/deepseek-v4-flash
    strong:
      id: strong
      model: accounts/fireworks/models/deepseek-v4-pro
    # 選ばれた tier がプールから落ちた（コンテキスト溢れなど）ときの退避先。
    # weak / strong のどちらかの id でなければ起動時に弾かれる。安い側に寄せる。
    fallback_target_on_evict: weak
    classifier:
      model: accounts/fireworks/models/deepseek-v4-flash
      timeout_secs: 30.0
      recent_turn_window: 3
