# dotfiles と環境構築を mise の native bootstrap へ寄せる。
#
# `mise bootstrap` が以下を順に、宣言的かつ idempotent に適用する:
#   1. [bootstrap.packages]     system packages（brew formula / brew-cask / mas）
#   2. [bootstrap.repos]        別リポジトリの clone（switchyard-bundle）
#   3. [dotfiles]               $HOME への symlink
#   4. shell activation
#   5. [bootstrap.macos.defaults] macOS のシステム設定
#   8. [bootstrap.user]         ログインシェル
#   9. mise install             [tools] のランタイム（~/.config/mise/config.toml）
#   10. `bootstrap` タスク        宣言で表せない補助（uv / pnpm global / agent skill）
#
# 実行:  mise bootstrap        （リポジトリ直下で。config は symlink されないため）
# 確認:  mise bootstrap -n     （dry-run。適用せず差分だけ表示）

# ---------------------------------------------------------------------------
# system packages（旧 .Brewfile + brew タスク）
# ---------------------------------------------------------------------------
# 注: mise の brew backend は brew CLI を呼ばず Homebrew API から直接メタデータを
# 取得する。API メタデータを公開しないサードパーティ tap（hashicorp/tap, k1LoW/tap
# など）の formula は install/upgrade できないため、それらは下の bootstrap タスクで
# `brew install` する（brew 側に置けば `brew upgrade` で面倒を見られる）。
[bootstrap.packages]
# CLI formulae
"brew:act" = "latest"
"brew:actionlint" = "latest"
"brew:awscli" = "latest"
"brew:aws-vault" = "latest"    # 旧 Brewfile は cask 指定だったが実体は formula
"brew:bat" = "latest"
"brew:deno" = "latest"
"brew:devcontainer" = "latest"
"brew:direnv" = "latest"
"brew:fastfetch" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:git-lfs" = "latest"
"brew:herdr" = "latest"
"brew:hermes-agent" = "latest"
"brew:hunk" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:lua-language-server" = "latest"
"brew:luajit" = "latest"        # 旧 Brewfile では --HEAD 指定。native では版指定を表現できないため latest
"brew:luarocks" = "latest"
"brew:mas" = "latest"           # mas: エントリの導入に必要
"brew:mosh" = "latest"
"brew:neovim" = "latest"
"brew:pam-reattach" = "latest"  # herdr / tmux 配下でも sudo の Touch ID を効かせる（下の bootstrap タスクで PAM に組み込む）
"brew:pngpaste" = "latest"
"brew:pnpm" = "latest"
"brew:ripgrep" = "latest"
"brew:ruby-lsp" = "latest"
"brew:rustup" = "latest"        # 旧 Brewfile は rustup-init（現在の formula 名は rustup）
"brew:sheldon" = "latest"
"brew:starship" = "latest"
"brew:tree" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:universal-ctags" = "latest"
"brew:vim" = "latest"
"brew:yamllint" = "latest"
"brew:yarn" = "latest"
# GUI アプリ（cask）
"brew-cask:1password-cli" = "latest"
"brew-cask:alacritty" = "latest"
"brew-cask:chromedriver" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:claude-code" = "latest"
# CleanShot はここで管理しない。最新版がライセンス対象外のため、
# 下の bootstrap タスクでライセンス済みの 4.7.7 に固定して入れる。
"brew-cask:codex" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:deepl" = "latest"
"brew-cask:discord" = "latest"
# docker-desktop は bootstrap タスク側で brew から入れる（下記参照）
# firefox も同様に bootstrap タスク側で brew から入れる（下記参照）
"brew-cask:font-udev-gothic-nf" = "latest"
"brew-cask:google-chrome" = "latest"
# google-japanese-ime / gyazo も bootstrap タスク側で brew から入れる（下記参照）
"brew-cask:imageoptim" = "latest"
"brew-cask:iterm2" = "latest"
"brew-cask:muzzle" = "latest"
"brew-cask:nani" = "latest"
# raycast も bootstrap タスク側で brew から入れる（下記参照）
"brew-cask:sequel-ace" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:spotify" = "latest"
# visual-studio-code も bootstrap タスク側で brew から入れる（下記参照）
# zoom も bootstrap タスク側で brew から入れる（下記参照）
# Mac App Store（数値は ADAM ID）
"mas:539883307" = "latest"      # LINE
"mas:497799835" = "latest"      # Xcode
# RunCat Neo (6757801838) は宣言しない。未導入の mas エントリを入れようとすると
# `mas install` が sudo を要求し、非対話実行では TTY がなく bootstrap 全体が落ちる。
# 導入済みの LINE / Xcode は照合だけで済むので影響しない。App Store から手動で入れること。

# ---------------------------------------------------------------------------
# 別リポジトリのチェックアウト
# dotfiles に同梱しないが環境の一部として要るものを、ghq レイアウトのパスへ clone する。
# switchyard-bundle は pi の呼び先を振り分けるルータのコンテナ定義。クライアントを
# 選ばない作りなので dotfiles とは分けてある（実際の起動は .bin.local/switchyard-serve）。
# ---------------------------------------------------------------------------
[bootstrap.repos]
"~/src/github.com/reona5/switchyard-bundle" = { url = "https://github.com/reona5/switchyard-bundle.git" }

# ---------------------------------------------------------------------------
# dotfiles の symlink（旧 link タスク）
# source はリポジトリルート（config_root）からの相対
# 注: ~/.claude は Claude Code のホームで、配下に履歴・セッション・プラグイン等の
#     ランタイムデータが Claude Code 自身によって書き込まれる。ディレクトリごと
#     symlink にすると初回起動が先行しただけで実ディレクトリが出来て破綻するため、
#     ~/.claude は実ディレクトリのままにし、管理対象のエントリだけを個別に張る。
#     実体は .config/claude/ 直下に置き、hooks/ は hook スクリプト専用とする。
#     skills/ 配下に張る自作 skill の symlink は下の bootstrap タスクで面倒を見る。
# ---------------------------------------------------------------------------
[dotfiles]
"~/.bin" = { source = ".bin", mode = "symlink" }
"~/.bin.local" = { source = ".bin.local", mode = "symlink" }
"~/.claude/settings.json" = { source = ".config/claude/settings.json", mode = "symlink" }
"~/.claude/statusline.py" = { source = ".config/claude/statusline.py", mode = "symlink" }
"~/.claude/skills" = { source = ".config/claude/skills", mode = "symlink" }
"~/.claude/hooks" = { source = ".config/claude/hooks", mode = "symlink" }
"~/.config" = { source = ".config", mode = "symlink" }
"~/.ctags.d" = { source = ".ctags.d", mode = "symlink" }
"~/.fzf.zsh" = { source = ".fzf.zsh", mode = "symlink" }
# git の設定は XDG の .config/git/ に移行済み（~/.config の symlink 経由で読まれる）ため
# ~/.gitconfig の宣言は持たない。
"~/.gitignore" = { source = ".gitignore", mode = "symlink" }
"~/.npmrc" = { source = ".npmrc", mode = "symlink" }
"~/.textlintrc.json" = { source = ".textlintrc.json", mode = "symlink" }
"~/.xvimrc" = { source = ".xvimrc", mode = "symlink" }
"~/.zshenv" = { source = ".zshenv", mode = "symlink" }
"~/.zshrc" = { source = ".zshrc", mode = "symlink" }
"~/.zsh" = { source = ".config/zsh", mode = "symlink" }
"~/.codex/config.toml" = { source = ".config/codex/config.toml", mode = "symlink" }
"~/.codex/hooks.json" = { source = ".config/codex/hooks.json", mode = "symlink" }
# pi も ~/.claude と同じ理由でディレクトリごとは張らない。~/.pi/agent/ には
# auth.json（provider の資格情報）と models-store.json（取得済みモデルカタログ）が
# 同居しており、どちらもリポジトリに入れてはいけない。管理対象の 4 つだけを張る。
"~/.pi/agent/keybindings.json" = { source = ".config/pi/keybindings.json", mode = "symlink" }
"~/.pi/agent/models.json" = { source = ".config/pi/models.json", mode = "symlink" }
"~/.pi/agent/settings.json" = { source = ".config/pi/settings.json", mode = "symlink" }
"~/.pi/agent/turn-recap.json" = { source = ".config/pi/turn-recap.json", mode = "symlink" }

# ---------------------------------------------------------------------------
# macOS のシステム設定（旧 defaults タスク）
# ドメインごとに key = value。値の型（int / float / bool / string）で自動判別
# ---------------------------------------------------------------------------
[bootstrap.macos.defaults]
"NSGlobalDomain" = { NSAutomaticCapitalizationEnabled = false, AppleInterfaceStyle = "Dark", KeyRepeat = 2, InitialKeyRepeat = 15, "com.apple.trackpad.scaling" = 3.0, AppleShowAllExtensions = true }
"com.apple.dock" = { launchanim = false, autohide = true, tilesize = 59, magnification = false }
"com.apple.finder" = { DisableAllAnimations = true, AppleShowAllFiles = true, ShowStatusBar = true, ShowPathbar = true }
"com.apple.menuextra.clock" = { DateFormat = "EEE d MMM HH:mm" }
"com.apple.menuextra.battery" = { ShowPercent = "YES" }

# ---------------------------------------------------------------------------
# ログインシェル（旧 install.sh の chsh）
# ---------------------------------------------------------------------------
[bootstrap.user]
login_shell = "/bin/zsh"

# ---------------------------------------------------------------------------
# 設定の妥当性検証（CI とローカルで共通、非破壊）
#   mise run verify
# ---------------------------------------------------------------------------
[tasks.verify]
description = "設定の妥当性を検証する（非破壊。CI と共通）"
run = [
  # install.sh の静的解析（shellcheck があれば実行、なければスキップ）
  '''
if command -v shellcheck >/dev/null 2>&1; then
  shellcheck .bin/install.sh
else
  echo "shellcheck not found; skipping install.sh lint"
fi
''',
  # bootstrap 全体の dry-run。package トークンの解決、dotfiles の source 存在、
  # defaults の妥当性、login shell、tools 解決までを一括検証する。
  # 不正な設定があれば非ゼロで終了するため、CI のゲートとして機能する。
  #
  # --force-dotfiles は「既存ファイルを壊す」検査を黙らせるためではなく、その検査が
  # 環境依存で偽陽性になるため付けている。~/.config は実ディレクトリとして存在しがちで
  # （mise 自身が ~/.config/mise/ を作る）、素の環境では必ず衝突として報告される。
  # ここで検証したいのは設定の妥当性であって実行環境の状態ではない。dry-run なので
  # 実際には何も書き換わらない。
  "mise bootstrap -n --force-dotfiles",
]

# ---------------------------------------------------------------------------
# 宣言で表せない補助（bootstrap の step 10 で自動実行される escape hatch）
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "uv / pnpm global / Switchyard / pi 拡張 / tap formula / herdr プラグイン / agent skill / ライセンス版 CleanShot / Capsomnia を導入する"
run = [
  "curl -LsSf https://astral.sh/uv/install.sh | sh",
  "command -v pnpm >/dev/null 2>&1 && pnpm -g i || true",
  '''
# pi の呼び先を振り分ける Switchyard のルータはコンテナで動かす。定義は dotfiles では
# なく reona5/switchyard-bundle にあり、ここではイメージを用意するだけ。PyPI の Python 版
# CLI は使わない（ルーティングの実体は Rust 側に移り、Python の native path は upstream で
# deprecated）。clone 自体は上の [bootstrap.repos] が step 2 で済ませている。
#
# イメージは crates.io から switchyard-server をビルドするので初回は数分かかる。
# 既にあれば何もしない。定義が無い・Docker が動いていない環境では案内だけ出して先へ進む
# （ここで落とすと bootstrap 全体が止まる）。
serve="$HOME/.bin.local/switchyard-serve"
if [ ! -f "$HOME/src/github.com/reona5/switchyard-bundle/docker-compose.yml" ]; then
  echo "switchyard: skipped (bundle not cloned). Clone reona5/switchyard-bundle, then run \\`switchyard-serve build\\`."
elif ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
  echo "switchyard: skipped image build (docker unavailable). Run \\`switchyard-serve build\\` later."
elif ! docker image inspect switchyard-switchyard >/dev/null 2>&1; then
  "$serve" build
fi
''',
  '''
# pi の拡張は .config/pi/settings.json の packages が source of truth。実体は
# ~/.pi/agent/{npm,git} に落ちるもので dotfiles には含めないため、新しいマシンでは
# 取り直す必要がある。リストを settings.json から読むことで二重管理を避ける。
# pi install は冪等。
root="${MISE_PROJECT_ROOT:-$PWD}"
if command -v pi >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
  jq -r '.packages[]?' "$root/.config/pi/settings.json" | while read -r src; do
    [ -n "$src" ] && pi install "$src" >/dev/null 2>&1 || true
  done
fi
''',
  # mise の brew backend で扱えないサードパーティ tap の formula は brew で入れる。
  # brew 管理下に置くので、以後は `brew upgrade` でまとめてアップグレードできる。
  # moshi-hook は iPhone の Moshi アプリから herdr / Claude Code を操作するためのホスト側 daemon。
  # 導入後のペアリング（moshi-hook host setup）はデバイス固有かつ対話的なので bootstrap には含めない。
  "command -v brew >/dev/null 2>&1 && brew install hashicorp/tap/terraform k1LoW/tap/mo rjyo/moshi/moshi-hook || true",
  # docker-desktop cask は binary の link 先を /usr/local/bin 直書きで宣言しており、
  # link 先が /opt/homebrew 配下でないと拒否する mise の brew-cask では扱えない。
  # 本家 brew なら /usr/local への link を問題なく処理するので brew で入れる。
  # brew 管理下に置くので、以後は `brew upgrade --cask` でアップグレードできる。
  "command -v brew >/dev/null 2>&1 && brew install --cask docker-desktop || true",
  # mise の brew-cask が未対応のアーティファクト種別を使う cask も brew で入れる。
  # mise は未知の種別に当たると bootstrap 全体を fail させるため、宣言から外す必要がある。
  #   firefox: command_wrapper（`firefox` CLI のラッパー）
  #   zoom:    postflight_steps
  # brew 管理下に置くので、以後は `brew upgrade --cask` でアップグレードできる。
  "command -v brew >/dev/null 2>&1 && brew install --cask firefox zoom || true",
  # pkg インストーラ形式の cask も brew で入れる。mise の brew-cask はこれを
  # 導入済みと判定できず毎回 `sudo installer` を叩こうとするため、非対話実行では
  # TTY がなく必ず失敗し、bootstrap 全体が止まる。
  #   google-japanese-ime: 実体が /Applications でなく /Library/Input Methods/ に入る
  #   gyazo:               pkg artifact
  # brew なら導入済みを正しく検出してスキップする（新規導入時のみ sudo を求める）。
  "command -v brew >/dev/null 2>&1 && brew install --cask google-japanese-ime gyazo || true",
  # 配布 URL に拡張子がない cask も brew で入れる。mise の brew-cask は URL から
  # アーカイブ形式を判定するため展開に失敗し、`app artifact ... was not found` で落ちる。
  #   raycast:            https://releases.raycast.com/releases/<ver>/download?build=arm
  #   visual-studio-code: https://update.code.visualstudio.com/<ver>/darwin-arm64/stable
  "command -v brew >/dev/null 2>&1 && brew install --cask raycast visual-studio-code || true",
  # herdr プラグイン（GitHub 配布・dotfiles にはファイルを持たないため bootstrap で導入）。
  # hunk レビュー統合。冪等（導入済みなら再取得のみ）。
  "command -v herdr >/dev/null 2>&1 && herdr plugin install yuucu/herdr-hunk --yes || true",
  '''
# hermes-agent の Slack gateway は slack extra（slack-bolt / slack-sdk / aiohttp）を必要と
# するが、formula はこれを同梱しない。公式インストーラなら `.[slack]` extra で解決される
# 部分で、formula 経由では venv へ直接入れるしかない。venv は Cellar 配下にあるため
# `brew upgrade hermes-agent` で消える。ここで復元する（未導入時のみ実行するので冪等）。
# バージョンは Hermes 側の LAZY_DEPS["platform.slack"] の固定値に合わせる。
py=/opt/homebrew/opt/hermes-agent/libexec/bin/python3
if [ -x "$py" ] && ! "$py" -c 'import slack_bolt' >/dev/null 2>&1; then
  "$py" -m pip install --quiet 'slack-bolt==1.29.0' 'slack-sdk==3.43.0' 'aiohttp==3.14.1'
fi
''',
  '''
# 自作 agent skill は skills/ を source of truth とし（gh skill publish が探索するレイアウト）、
# 各エージェントが読む skills ディレクトリへ symlink で参照させる。
#   - ~/.claude/skills/（= .config/claude/skills/）: Claude Code
#   - ~/.agents/skills/:                        Agent Skills 標準ディレクトリ（opencode / pi などが読む）
# skills/ に新しい skill を足したら、このタスクを流せば link が張られる（冪等）。
root="${MISE_PROJECT_ROOT:-$PWD}"
mkdir -p "$root/.config/claude/skills" "$HOME/.agents/skills"
for dir in "$root"/skills/*/; do
  name="$(basename "$dir")"
  ln -sfn "../../../skills/$name" "$root/.config/claude/skills/$name"
  ln -sfn "$root/skills/$name" "$HOME/.agents/skills/$name"
done
''',
  # gh 由来の skill は dotfiles に実体を持たず（.gitignore 済み）、gh を source of truth にする。
  # 更新は `gh skill update`。冪等（--force で既存を上書き）。
  "command -v gh >/dev/null 2>&1 && gh skill install github/gh-stack gh-stack --agent claude-code --scope user --force || true",
  '''
# CleanShot は Homebrew cask の最新版(4.8.9)が手持ちライセンスの対象外のため、
# brew-cask では管理せず、公式 CDN の versioned DMG からライセンス済みの
# 4.7.7 を固定インストールする（Homebrew cask は旧バージョン固定に非対応）。
# 既に導入済みなら何もしない（冪等）。
CLEANSHOT_VERSION=4.7.7
if [ ! -d "/Applications/CleanShot X.app" ]; then
  tmp="$(mktemp -d)"
  curl -fsSL -o "$tmp/CleanShot.dmg" "https://updates.getcleanshot.com/v3/CleanShot-X-${CLEANSHOT_VERSION}.dmg"
  hdiutil attach -nobrowse -quiet "$tmp/CleanShot.dmg" -mountpoint "$tmp/mnt"
  cp -R "$tmp/mnt/CleanShot X.app" /Applications/
  hdiutil detach -quiet "$tmp/mnt"
  xattr -dr com.apple.quarantine "/Applications/CleanShot X.app" 2>/dev/null || true
  rm -rf "$tmp"
fi
''',
  '''
# Capsomnia（Caps Lock で蓋を閉じてもスリープさせない）は Homebrew cask が無く、
# GitHub Releases の pkg 配布のみ。特権ヘルパー（/Library/PrivilegedHelperTools/
# capsomnia-pmset）を含むため .app コピーでは動かず、installer で入れる（要 sudo）。
# 既に導入済みなら何もしない（冪等）。
# sudo が使えない実行（TTY なし・非対話）では導入をスキップする。ここで落とすと
# bootstrap 全体が失敗するため、案内だけ出して先に進める。
if [ ! -d "/Applications/Capsomnia.app" ]; then
  if sudo -n true 2>/dev/null; then
    tmp="$(mktemp -d)"
    curl -fsSL -o "$tmp/Capsomnia.pkg" "https://github.com/fuji-mak/Capsomnia/releases/latest/download/Capsomnia.pkg"
    sudo installer -pkg "$tmp/Capsomnia.pkg" -target /
    rm -rf "$tmp"
  else
    echo "Capsomnia: skipped (sudo unavailable). Run \`sudo -v && mise run bootstrap\` to install."
  fi
fi
''',
  '''
# sudo の認証を Touch ID で通す。/etc/pam.d/sudo_local は OS アップデートを跨いで
# 残るローカル設定で、/etc/pam.d/sudo の `auth include sudo_local` から読まれる。
# /etc 配下なので [dotfiles] の symlink では管理できず、ここで作る（要 sudo）。
#
# pam_tid.so だけでは herdr / tmux のペイン内で Touch ID が出ない。multiplexer の
# セッションは GUI の Aqua セッションから切り離されており、Touch ID のプロンプトを
# 出せないため。pam_reattach.so が元のセッションに再アタッチしてこれを解消するので、
# 必ず pam_tid.so より前に置く。ignore_ssh で SSH ログイン時は無効化する
# （リモートに Touch ID は無く、パスワードにフォールバックさせる）。
# 内容が一致していれば何もしない（冪等）。
reattach="$(brew --prefix 2>/dev/null)/lib/pam/pam_reattach.so"
if [ -f "$reattach" ]; then
  desired="auth       optional       $reattach ignore_ssh
auth       sufficient     pam_tid.so"
else
  desired="auth       sufficient     pam_tid.so"
fi
# sudo が使えない実行（TTY なし・非対話）では書き込みをスキップする。ここで落とすと
# bootstrap 全体が失敗するため、案内だけ出して先に進める。
if [ "$(cat /etc/pam.d/sudo_local 2>/dev/null)" != "$desired" ]; then
  if sudo -n true 2>/dev/null; then
    printf '%s\n' "$desired" | sudo tee /etc/pam.d/sudo_local >/dev/null
    sudo chmod 644 /etc/pam.d/sudo_local
  else
    echo "sudo_local: skipped (sudo unavailable). Run \`sudo -v && mise run bootstrap\` to apply."
  fi
fi
''',
]
